<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo - Pasajero</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; }
        #map { height: 50vh; width: 100vw; }
        .panel { padding: 20px; background: #121212; border-top-left-radius: 20px; border-top-right-radius: 20px; margin-top: -20px; position: relative; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background: #fff; color: #000; font-weight: bold; cursor: pointer; }
        #loginPasajeroPanel, #appPasajeroMain { height: 100vh; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
        #loginPasajeroPanel { padding: 20px; background: #121212; position: absolute; top: 0; left: 0; width: 100%; z-index: 3000; }
    </style>
</head>
<body>

    <!-- Panel de Registro / Login Inicial del Pasajero -->
    <div id="loginPasajeroPanel">
        <h2>Bienvenido a Primo</h2>
        <p style="color: #aaa; font-size: 14px;">Ingresa tus datos una sola vez para pedir viajes rápidamente.</p>
        <input type="text" id="nombrePasajeroReg" placeholder="Tu Nombre Completo" required>
        <input type="tel" id="telPasajeroReg" placeholder="Tu WhatsApp (ej: +54911...)" required>
        <button onclick="guardarLoginPasajero()">GUARDAR Y CONTINUAR</button>
    </div>

    <!-- Interfaz Principal del Pasajero -->
    <div id="appPasajeroMain" style="display:none; height:auto;">
        <div id="map"></div>
        <div class="panel">
            <h2>Pedir Viaje <span id="saludoPasajero" style="font-size:12px; float:right; color:#aaa;"></span></h2>
            
            <div id="tripForm">
                <p id="gpsStatus" style="color: #ff9900; font-size: 13px; margin: 0 0 8px 0;">📍 Obteniendo tu ubicación GPS obligatoria...</p>
                <input type="text" id="origen" placeholder="Dirección de Origen" required>
                <input type="text" id="destino" placeholder="Dirección de Destino" required>
                <button id="btnPedir" onclick="pedirViaje()" style="opacity: 0.5; cursor: not-allowed;" disabled>SOLICITAR VIAJE</button>
                <button onclick="cerrarSesionPasajero()" style="background:#222; color:#ff4444; border:1px solid #444; margin-top:15px;">CERRAR SESIÓN</button>
            </div>

            <div id="statusView" style="display:none;">
                <h3 id="statusText" style="color: #ff9900;">Buscando conductor...</h3>
                <div id="driverInfo" style="background:#1e1e1e; padding:15px; border-radius:10px; margin-top:10px; display:none;">
                    <p><b>Conductor:</b> <span id="dName"></span></p>
                    <a id="driverWpLink" target="_blank" style="display:block; text-align:center; background:#25D366; color:#fff; padding:10px; border-radius:6px; text-decoration:none; font-weight:bold; margin-top:8px;">Llamar a driver</a>
                </div>
                <button onclick="cancelarViaje()" style="background:#ff3333; color:#fff; margin-top:15px;">CANCELAR VIAJE</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
